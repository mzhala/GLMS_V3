services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123!"
    ports:
      - "1433:1433"

  glms-api:
    build:
      context: .
      dockerfile: GLMS_V3_API/Dockerfile
    container_name: glms-api
    depends_on:
      - sql-server-db
    ports:
      - "7277:8080"

  glms-web:
    build:
      context: .
      dockerfile: GLMS_V3/Dockerfile
    container_name: glms-web
    depends_on:
      - glms-api
    ports:
      - "5000:8081"